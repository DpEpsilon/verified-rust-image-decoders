# Hand-written decisions for icns_verus (x86_64-unknown-linux-gnu, release).
# draft_allowlist.py copies everything after the `--- entries ---` marker
# verbatim into the draft allowlist.
# ERRATA E14: the decoders are methods on the opaque `Parsed` handle, and the
# canonical path of an inherent method names the impl's lifetime parameter, so
# the roots are spelled `Parsed::<'a>::…` exactly as the tool reports them.
required_roots = ["crate::icns::try_parse", "crate::icns::Parsed::<'a>::entries", "crate::icns::Parsed::<'a>::try_decode_rgb", "crate::icns::Parsed::<'a>::try_decode_mask", "crate::icns::Parsed::<'a>::try_combine"]

# --- entries ---
# -- Allocation-capable items, one entry per (item, admitted guard function) --
[[entry]]
kind = "alloc"
item = "alloc::vec::Vec::<T, A>::try_reserve_exact<u8,alloc::alloc::Global>"
allow = "crate::alloc_guard::try_zeroed"
contract = "on an empty Vec<u8>, one exact reservation of n bytes (RawVecInner::try_reserve_exact -> grow_exact -> finish_grow -> __rust_alloc / __rust_realloc / __rust_dealloc); failure is returned as Err, never aborts"
citation = "A-STD-1, A-STD-3 (SPEC §3); alloc/src/vec/mod.rs Vec::try_reserve_exact at rustc 58cf8f9c3; mod.rs hash-pinned (D6)"

[[entry]]
kind = "alloc"
item = "alloc::vec::Vec::<T, A>::try_reserve_exact<u8,alloc::alloc::Global>"
allow = "crate::alloc_guard::sites::try_copy"
contract = "on an empty Vec<u8>, one exact reservation of s.len() bytes; failure is returned as Err, never aborts"
citation = "A-STD-1, A-STD-3 (SPEC §3); ICNS sites.rs hash-pinned (EXPECTED_SITES_SHA)"

[[entry]]
kind = "alloc"
item = "alloc::vec::Vec::<T, A>::try_reserve_exact<crate::icns::Entry,alloc::alloc::Global>"
allow = "crate::alloc_guard::sites::try_with_room"
contract = "on an empty Vec<Entry>, one exact reservation of n <= MAX_ROOM elements (n * size_of::<Entry>() <= isize::MAX by lemma_entry_layout); failure is returned as Err, never aborts"
citation = "A-STD-1, A-STD-3 (SPEC §3, ERRATA E5: try_with_room lives in sites.rs); ICNS sites.rs hash-pinned"

[[entry]]
kind = "alloc"
item = "alloc::vec::Vec::<T, A>::resize<u8,alloc::alloc::Global>"
allow = "crate::alloc_guard::try_zeroed"
contract = "resize(n, 0) on a Vec<u8> with len 0 and capacity >= n: no reserve/grow path is taken; the growth path in its MIR (reserve -> finish_grow -> __rust_alloc/__rust_realloc, handle_error) is present but not taken"
citation = "A-STD-1 and A-STD-4 (ERRATA E6; observed, not documented)"

[[entry]]
kind = "alloc"
item = "alloc::vec::Vec::<T, A>::push<u8,alloc::alloc::Global>"
allow = "crate::alloc_guard::sites::try_copy"
contract = "push of s.len() bytes into a Vec<u8> whose capacity is >= s.len() after try_reserve_exact(s.len()) returned Ok: never grows; the growth path in its MIR (grow_one -> finish_grow -> __rust_alloc/__rust_realloc, handle_error) is present but not taken"
citation = "A-STD-1 and A-STD-2 (SPEC §3)"

[[entry]]
kind = "alloc"
item = "alloc::vec::Vec::<T, A>::push<crate::icns::Entry,alloc::alloc::Global>"
allow = "crate::alloc_guard::sites::Reserved::<T>::push"
contract = "Reserved::push requires len < room <= capacity (Reserved's invariant), so Vec::push never grows; the growth path in its MIR is present but not taken"
citation = "A-STD-1, A-STD-2 and Reserved's documented invariant v@.len() <= room <= capacity: room <= capacity is a doc comment, not a Verus invariant (vstd models no capacity); callers are crate-internal and must prove len < room (SPEC §3; ICNS sites.rs)"

[[entry]]
kind = "alloc"
item = "alloc::raw_vec::RawVecInner::<A>::deallocate"
allow = "*"
contract = "deallocation (__rust_dealloc) of a Vec buffer on drop; cannot fail"
citation = "SPEC §6: deallocation anywhere; `*` admits deallocation sinks only (tool rule, ERRATA E7)"

# -- Generic exports of the guard: NONE (D3/D4 resolved 2026-11-14). `try_with_room<T>`,
#    `Reserved<T>`, `Reserved::push` and `Reserved::into_vec` are `pub(crate)` in the
#    hash-pinned sites.rs, so they are no longer exported and the tool no longer reports
#    `generic-pub-fn`; the walk still audits their `Entry` instantiations as crate-internal
#    callees. See ERRATA E10. --

# -- Exported roots that are excluded from the walk (owner decision required) --
# E14 adds `Parsed::<'a>::bytes` to the exported set; it is an allocation-free
# accessor, so it stays in the walk as an ordinary root and needs no exclusion.
[[entry]]
kind = "root-exclude"
item = "<crate::icns::Decoded as core::clone::Clone>::clone"
citation = "OWNER DECISION: derive(Clone) on the public output type clones its Vec<u8> with an infallible allocation (Vec::clone -> to_vec_in -> handle_error). Not reachable from any try_* root; runs only when a caller clones a result. Recorded in alloc-delta/ERRATA.md E7"

# -- Guard call sites (SPEC §6 per-core checks; icns/tools/audit_alloc.sh) --
