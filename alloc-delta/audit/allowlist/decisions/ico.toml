# Hand-written decisions for ico_verus (x86_64-unknown-linux-gnu, release).
# draft_allowlist.py copies everything after the `--- entries ---` marker
# verbatim into the draft allowlist.
required_roots = ["crate::ico::try_parse", "crate::ico::try_parse_with_steps", "crate::ico::try_decode_entry", "crate::ico::try_decode_entry_with_steps"]

# --- entries ---
[[entry]]
kind = "alloc"
item = "alloc::vec::Vec::<T, A>::try_reserve_exact<u8,alloc::alloc::Global>"
allow = "crate::alloc_guard::try_zeroed"
contract = "on an empty Vec<u8>, one exact reservation of n bytes (RawVecInner::try_reserve_exact -> grow_exact -> finish_grow -> __rust_alloc / __rust_realloc / __rust_dealloc); failure is returned as Err, never aborts"
citation = "A-STD-1, A-STD-3 (SPEC §3); alloc/src/vec/mod.rs Vec::try_reserve_exact at rustc 58cf8f9c3; mod.rs hash-pinned (D6)"

[[entry]]
kind = "alloc"
item = "alloc::vec::Vec::<T, A>::try_reserve_exact<crate::ico::Entry,alloc::alloc::Global>"
allow = "crate::alloc_guard::sites::try_with_room"
contract = "on an empty Vec<Entry>, one exact reservation of n <= MAX_ROOM (4,096; ICO header count <= 1,024) elements (n * size_of::<Entry>() <= isize::MAX by lemma_entry_layout); failure is returned as Err, never aborts"
citation = "A-STD-1, A-STD-3 (SPEC §3, ERRATA E5: try_with_room lives in sites.rs); ICO sites.rs hash-pinned"

[[entry]]
kind = "alloc"
item = "alloc::vec::Vec::<T, A>::resize<u8,alloc::alloc::Global>"
allow = "crate::alloc_guard::try_zeroed"
contract = "resize(n, 0) on a Vec<u8> with len 0 and capacity >= n: no reserve/grow path is taken; the growth path in its MIR (reserve -> finish_grow -> __rust_alloc/__rust_realloc, handle_error) is present but not taken"
citation = "A-STD-1 and A-STD-4 (ERRATA E6; observed, not documented)"

[[entry]]
kind = "alloc"
item = "alloc::vec::Vec::<T, A>::push<crate::ico::Entry,alloc::alloc::Global>"
allow = "crate::alloc_guard::sites::Reserved::<T>::push"
contract = "Reserved::push requires len < room <= capacity (Reserved's invariant), so Vec::push never grows; the growth path in its MIR is present but not taken"
citation = "A-STD-1, A-STD-2 and Reserved's documented invariant v@.len() <= room <= capacity: room <= capacity is a doc comment, not a Verus invariant (vstd models no capacity); callers are crate-internal and must prove len < room (SPEC §3; ICO sites.rs)"

[[entry]]
kind = "alloc"
item = "alloc::raw_vec::RawVecInner::<A>::deallocate"
allow = "*"
contract = "deallocation (__rust_dealloc) of a Vec buffer on drop; cannot fail"
citation = "SPEC §6: deallocation anywhere; `*` admits deallocation sinks only (tool rule, ERRATA E7)"

# -- Generic exports of the guard: NONE (D3/D4 resolved 2026-11-14). `try_with_room<T>`,
#    `Reserved<T>`, `Reserved::push` and `Reserved::into_vec` are `pub(crate)` in the
#    hash-pinned sites.rs, so they are no longer exported and the tool no longer reports
#    `generic-pub-fn`; the walk still audits their `Entry` instantiations as crate-internal
#    callees. See ERRATA E10. --

# -- DIB, the one path dependency (SPEC §6 dependency contracts, §9 crate rule) --
[[entry]]
kind = "crate"
item = "dib_verus"
reason = "ICO decodes entries through DIB's try_decode_with_steps_logged (SPEC §3.1, O6)"

[[entry]]
kind = "dependency"
item = "dib_verus"
report = "$RUN/dib_verus-in-ico.txt"
reason = "DIB's own audit of the exact dib_verus compilation linked into this ICO build (same crate hash), produced in the same run"

[[entry]]
kind = "no-mir"
item = "dib_verus::dib::try_decode_with_steps_logged"
allow = "crate::ico::try_decode_entry_logged"
contract = "allocates exactly what DIB's audit admits: one try_zeroed output reservation through DIB's guard, plus deallocation"
citation = "dependency contract: DIB's own audit report for the linked crate hash must PASS (kind = dependency above); A-DIB-8, SPEC §3.1"

[[entry]]
kind = "no-mir"
item = "dib_verus::dib::try_decode_with_steps"
allow = "crate::skeleton"
contract = "allocates exactly what DIB's audit admits (try_decode_with_steps is a DIB root)"
citation = "dependency contract: DIB's own audit report for the linked crate hash must PASS; lib.rs::skeleton stays pub (SPEC O1)"

# -- Guard call sites (SPEC §6 per-core checks; ico/tools/audit_alloc.sh) --
[[entry]]
kind = "guard-calls"
item = "crate::alloc_guard::sites::try_with_room"
sites = 1
reason = "ICO: one try_with_room site (EntryList) in the parse path"

[[entry]]
kind = "guard-calls"
item = "crate::alloc_guard::sites::import_dib"
sites = 1
reason = "ICO: import_dib called exactly once, in the decode-entry path, on DIB's result and log"

[[entry]]
kind = "guard-calls"
item = "dib_verus::dib::try_decode_with_steps_logged"
sites = 1
reason = "ICO: exactly one call to DIB's logged entry point"
