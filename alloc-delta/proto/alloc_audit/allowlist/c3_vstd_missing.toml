# Prototype allowlist for testcase c1_clean.
# This is a *test fixture*, not a reviewed production allowlist: it exists to
# show the format and to make the clean control pass. A production allowlist
# for DIB would carry the DIB source hash, the full commit, and a named human
# reviewer.

[meta]
rustc_commit = "58cf8f9c3"
target = "x86_64-unknown-linux-gnu"
profile = "opt-level=2,debug-assertions=off,share-generics=off"
reviewer = "prototype-fixture"
source_hash = "421c566ef65ad46de5198a337ceca4d7119e620fbd40b102593b62c4e2b61727"

# --- allocation-capable items, enumerated per caller ---------------------

# The single reservation site. `guard::try_zeroed` reserves `n` bytes exactly;
# the growth path cannot be taken because capacity was reserved first, so the
# only allocator entry reached is the one call to `allocate`.
[[entry]]
item = "alloc::raw_vec::RawVecInner::<A>::reserve_exact"
kind = "alloc"
allow = "guard::try_zeroed"
reason = "the crate's only reservation; exact, from the guard module"
reviewer = "prototype-fixture"

# The guard fills with `push` after reserving exactly, so the fills do not
# regrow. The MIR edge `push_mut -> grow_one -> grow_amortized -> finish_grow`
# exists regardless, so the reviewer must name `push` as an allocation-capable
# item admitted from the guard (SPEC §6: "`Vec::<T>::push`: only from
# `alloc_guard` functions"). Without this entry the strict all-paths check
# correctly refuses the guard's own push path; the old first-parent check hid
# it behind the reserve path.
[[entry]]
item = "std::vec::Vec::<T, A>::push_mut"
kind = "alloc"
allow = "guard::try_zeroed"
reason = "guard fills after try_reserve_exact(n); the growth path finish_grow -> handle_alloc_error is not taken (A-STD-1)"
reviewer = "prototype-fixture"

# Deallocation, anywhere.
[[entry]]
item = "alloc::raw_vec::RawVecInner::<A>::deallocate"
kind = "alloc"
allow = "*"
reason = "deallocation cannot fail"
reviewer = "prototype-fixture"

