# Prototype allowlist for the N14 two-guards-plus-third control.
#
# Same as c2_two_guards: the shared `RawVecInner::<A>::reserve_exact` instance
# has two entries, admitting `guard_a::try_zeroed` and `guard_b::try_zeroed`.
# The third caller, `unapproved_third`, is admitted by neither, so the audit
# must fail even though every matching entry is now consulted.

[meta]
rustc_commit = "58cf8f9c3"
vstd_version = "0.0.0-2026-11-01-0251"
vstd = "none"
target = "x86_64-unknown-linux-gnu"
profile = "opt-level=2,debug-assertions=off,share-generics=off"
reviewer = "prototype-fixture"
source_hash = "a112321e742f2862887d1ed0b9952d8981556010ba89dbdc43a03c5177be585f"

[[entry]]
item = "alloc::raw_vec::RawVecInner::<A>::reserve_exact"
kind = "alloc"
allow = "guard_a::try_zeroed"
reason = "the first guard's reservation; exact, from guard_a"
reviewer = "prototype-fixture"

[[entry]]
item = "alloc::raw_vec::RawVecInner::<A>::reserve_exact"
kind = "alloc"
allow = "guard_b::try_zeroed"
reason = "the second guard's reservation; the same shared instance, a different admitted caller"
reviewer = "prototype-fixture"

[[entry]]
item = "alloc::raw_vec::RawVecInner::<A>::deallocate"
kind = "alloc"
allow = "*"
reason = "deallocation cannot fail"
reviewer = "prototype-fixture"

