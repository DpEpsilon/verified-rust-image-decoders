[package]
name = "nostd_probe_a"
version = "0.1.0"
license = "MIT"
description = "Negative control: std use inside a no_std crate must fail"
edition = "2021"

[dependencies]
vstd = { version = "=0.0.0-2026-11-01-0251", default-features = false, features = ["alloc"] }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }
