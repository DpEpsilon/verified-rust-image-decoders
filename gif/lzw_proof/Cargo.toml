[package]
name = "lzw_proof"
version = "0.1.0"
license = "MIT"
description = "Formally verified (Verus) GIF LZW decode core (T-LZW), milestone M2 of gif_verus"
edition = "2021"

[dependencies]
vstd = { version = "=0.0.0-2026-11-01-0251", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Test-only: reads spec-draft/VECTORS.json and tests/expected/*.json.
serde_json = "1"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }
