[package]
name = "leniency-dds-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["dds"] }
glycin-image-rs = { path = "../../glycin-plan/glycin/glycin-loaders/glycin-image-rs", default-features = false, features = ["builtin"] }
glycin-utils = { path = "../../glycin-plan/glycin/glycin-utils", default-features = false, features = ["builtin", "loader-utils"] }
ddsfile = "0.5"
bcdec_rs = "0.2"
texpresso = "2"
image_dds = { version = "0.7", default-features = false, features = ["ddsfile"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = 2
debug-assertions = false
overflow-checks = false
