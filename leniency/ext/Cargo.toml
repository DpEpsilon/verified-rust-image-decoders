[package]
name = "leniency-ext-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["pnm", "qoi", "ff"] }
glycin-image-rs = { path = "../../glycin-plan/glycin/glycin-loaders/glycin-image-rs", default-features = false, features = ["builtin"] }
glycin-utils = { path = "../../glycin-plan/glycin/glycin-utils", default-features = false, features = ["builtin", "loader-utils"] }
qoi = "=0.4.1"
rapid-qoi = "=0.6.3"
zune-qoi = "=0.5.2"
zune-ppm = "=0.5.1"
oxideav-pbm = "=0.0.5"
farbfeld = "=0.3.1"
zune-farbfeld = "=0.5.2"
zune-core = "=0.5.3"
serde_json = "1.0"
sha2 = "0.10"
