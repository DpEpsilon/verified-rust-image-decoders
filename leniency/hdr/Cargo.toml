[package]
name = "leniency-hdr-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["hdr"] }
glycin-image-rs = { path = "../../glycin-plan/glycin/glycin-loaders/glycin-image-rs", default-features = false, features = ["builtin"] }
glycin-utils = { path = "../../glycin-plan/glycin/glycin-utils", default-features = false, features = ["builtin", "loader-utils"] }
radiant = "0.3"
hdrldr = "0.1"
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = 2
debug-assertions = false
overflow-checks = false
