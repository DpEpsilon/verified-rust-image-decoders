[package]
name = "leniency-xbm-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "=0.25.10", default-features = false }
image-extras = { version = "=0.1.1", default-features = false, features = ["xbm"] }
xbm = { version = "=0.3.0", default-features = false }
glycin-image-rs = { path = "../../glycin-plan/glycin/glycin-loaders/glycin-image-rs", default-features = false, features = ["builtin"] }
glycin-utils = { path = "../../glycin-plan/glycin/glycin-utils", default-features = false, features = ["builtin", "loader-utils"] }
serde_json = "1.0"
sha2 = "0.10"
